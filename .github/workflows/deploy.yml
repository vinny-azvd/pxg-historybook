name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The prebuild step sparse-fetches small sprites from a pinned
      # PokeAPI/sprites commit; caching that checkout by the commit SHA means
      # GitHub is only hit again when sprites-commit.json changes.
      - id: sprites
        run: echo "commit=$(node -p "require('./apps/frontend/scripts/pokemon/sprites-commit.json').commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: apps/frontend/.cache/pokeapi-sprites
          key: pokeapi-sprites-${{ steps.sprites.outputs.commit }}
      - run: npm run build -w apps/frontend
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
